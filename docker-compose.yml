services:
  mongo:
    image: mongo:7
    container_name: jobs-mongo
    # Bound to this machine only. MongoDB here has no password, so it must never be reachable from the network.
    ports: ["127.0.0.1:27017:27017"]
    volumes: ["jobs-mongo-data:/data/db"]
    restart: unless-stopped
volumes:
  jobs-mongo-data:
